<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #14213d; }
      .subtitle { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #33415c; }
      .h { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f2a5f; }
      .b { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #1f2d3d; }
      .chip { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #0d47a1; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#355ca8" />
    </marker>
  </defs>

  <rect width="1400" height="720" fill="#f5f7fc" />
  <text x="700" y="54" text-anchor="middle" class="title">Data Acquisition &amp; Verification Flow</text>
  <text x="700" y="82" text-anchor="middle" class="subtitle">Public Catastrophic Crisis Briefing Assistant</text>

  <rect x="60" y="130" width="280" height="180" rx="14" fill="#ffffff" stroke="#cfd9f2" />
  <text x="200" y="165" text-anchor="middle" class="h">1) Source Ingestion</text>
  <text x="84" y="198" class="b">- Tier A: USGS / NOAA / FEMA / CDC / WHO</text>
  <text x="84" y="224" class="b">- Tier B: GDACS / ReliefWeb / FIRMS</text>
  <text x="84" y="250" class="b">- Tier C: Signal-only sources</text>
  <text x="84" y="276" class="b">- Capture source + publish + retrieval time</text>

  <rect x="390" y="130" width="300" height="180" rx="14" fill="#ffffff" stroke="#cfd9f2" />
  <text x="540" y="165" text-anchor="middle" class="h">2) Normalization</text>
  <text x="414" y="198" class="b">- Standardize timestamps (UTC)</text>
  <text x="414" y="224" class="b">- Canonicalize event type and location</text>
  <text x="414" y="250" class="b">- Parse structured impact fields</text>
  <text x="414" y="276" class="b">- Build deterministic event keys</text>

  <rect x="740" y="130" width="300" height="180" rx="14" fill="#ffffff" stroke="#cfd9f2" />
  <text x="890" y="165" text-anchor="middle" class="h">3) Verification Engine</text>
  <text x="764" y="198" class="b">- Apply source-tier rules</text>
  <text x="764" y="224" class="b">- Corroboration checks</text>
  <text x="764" y="250" class="b">- Freshness and supersession logic</text>
  <text x="764" y="276" class="b">- Status: confirmed / preliminary / unverified</text>

  <rect x="1090" y="130" width="250" height="180" rx="14" fill="#ffffff" stroke="#cfd9f2" />
  <text x="1215" y="165" text-anchor="middle" class="h">4) Output Package</text>
  <text x="1112" y="198" class="b">- Structured JSON records</text>
  <text x="1112" y="224" class="b">- Conflict flags + details</text>
  <text x="1112" y="250" class="b">- Evidence notes</text>
  <text x="1112" y="276" class="b">- Traceable audit fields</text>

  <line x1="340" y1="220" x2="390" y2="220" stroke="#355ca8" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="690" y1="220" x2="740" y2="220" stroke="#355ca8" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="1040" y1="220" x2="1090" y2="220" stroke="#355ca8" stroke-width="3" marker-end="url(#arrow)" />

  <rect x="120" y="390" width="1160" height="250" rx="14" fill="#ffffff" stroke="#cfd9f2" />
  <text x="700" y="428" text-anchor="middle" class="h">Quality Gates</text>

  <rect x="160" y="455" width="210" height="56" rx="10" fill="#edf3ff" stroke="#bcd0ff" />
  <text x="265" y="489" text-anchor="middle" class="chip">QG-01 Attribution Complete</text>

  <rect x="390" y="455" width="260" height="56" rx="10" fill="#edf3ff" stroke="#bcd0ff" />
  <text x="520" y="489" text-anchor="middle" class="chip">QG-02 No Unsupported Confirmations</text>

  <rect x="670" y="455" width="250" height="56" rx="10" fill="#edf3ff" stroke="#bcd0ff" />
  <text x="795" y="489" text-anchor="middle" class="chip">QG-03 Status/Confidence Valid</text>

  <rect x="940" y="455" width="300" height="56" rx="10" fill="#edf3ff" stroke="#bcd0ff" />
  <text x="1090" y="489" text-anchor="middle" class="chip">QG-04 Conflicts Explicitly Represented</text>

  <rect x="430" y="530" width="540" height="56" rx="10" fill="#edf3ff" stroke="#bcd0ff" />
  <text x="700" y="564" text-anchor="middle" class="chip">QG-05 Supersession Consistency + Deterministic Re-runs</text>
</svg>
